name: Sentinel Monitor CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B package -DskipTests

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monitor-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  flutter:
    name: Flutter test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter-status
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Test
        run: flutter test

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
